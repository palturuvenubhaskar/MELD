spring:
  application:
    name: meld
  profiles:
    # Local development is the default; CI overrides with SPRING_PROFILES_ACTIVE.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes are Flyway migrations only. Never let Hibernate emit DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  task:
    scheduling:
      pool:
        # One thread runs the queue loop; another keeps leases alive during a
        # long node call.
        size: 2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        name: MELD_SESSION
        http-only: true
        same-site: lax
        # Enable in production (HTTPS only). Local HTTP development needs false.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

meld:
  security:
    # Base64-encoded 32-byte AES-256 key for provider credentials.
    # Required at startup; the real value lives only in the environment.
    credential-encryption-key: ${MELD_CREDENTIAL_ENCRYPTION_KEY:}
  providers:
    # Server-side transport policy. Base URLs are configuration, never user input.
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:10s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:60s}
    base-urls:
      openrouter: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      openai: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      groq: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      ollama: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
  execution:
    # The scheduler can be disabled in tests, which then call the worker directly.
    worker-enabled: ${MELD_EXECUTION_WORKER_ENABLED:true}
    poll-interval-ms: ${MELD_EXECUTION_POLL_INTERVAL_MS:500}
    heartbeat-interval-ms: ${MELD_EXECUTION_HEARTBEAT_INTERVAL_MS:10000}
    lease-duration: ${MELD_EXECUTION_LEASE_DURATION:2m}
    max-per-poll: ${MELD_EXECUTION_MAX_PER_POLL:5}
    max-nodes-per-execution: ${MELD_EXECUTION_MAX_NODES:100}
  tools:
    # Default-deny egress. HTTP is only for explicitly opted-in deployments.
    allow-insecure-http: ${MELD_TOOLS_ALLOW_INSECURE_HTTP:false}
    connect-timeout: ${TOOL_CONNECT_TIMEOUT:5s}
    read-timeout: ${TOOL_READ_TIMEOUT:15s}
    max-response-bytes: ${TOOL_MAX_RESPONSE_BYTES:1048576}
    max-redirects: ${TOOL_MAX_REDIRECTS:3}
