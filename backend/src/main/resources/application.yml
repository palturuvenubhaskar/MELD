spring:
  application:
    name: meld
  profiles:
    # Local development is the default; CI overrides with SPRING_PROFILES_ACTIVE.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes are Flyway migrations only. Never let Hibernate emit DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
